<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IP Package Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 60vh; width: 100%; }
        #stats { padding: 1rem; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #333; }
        .chart-container { height: 300px; margin-top: 20px; }
        #location-list { list-style-type: none; padding: 0; }
        #location-list li { padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📦 IP Sender Package Visualizer</h2>
        <div id="map"></div>
        <div id="stats">
            <h4>Top Locations</h4>
            <ul id="location-list"></ul>
            <h4>Package Activity Timeline</h4>
            <div class="chart-container">
                <canvas id="activityChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
